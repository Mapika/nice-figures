name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install matplotlib numpy scipy pytest
      - name: Unit tests + every recipe in chart_recipes.md
        run: pytest tests/ -q
      - name: Showcase figures render
        run: python assets/generate_showcase.py
